[package]
name = "fodelta"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A local, single-branch directory version control tool"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zeaphoo/fodelta"
default-run = "fodelta"

[dependencies]
anstream = "1"
anstyle = "1"
anyhow = "1"
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
ignore = "0.4"
indicatif = "0.18"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
similar = "3.2"
thiserror = "2"
toml = "1.1"
zstd = "0.14"

[dev-dependencies]
assert_cmd = "2"
criterion = "0.8"
predicates = "3"
proptest = "1"
tempfile = "3"

[[bench]]
name = "diff"
harness = false

[[bench]]
name = "status"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
